[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specdd"
version = "0.1.0"
description = "Spec-Driven Development CLI orchestrator for AI-assisted development"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "fastmcp>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
specdd = "specdd.cli:app"
specdd-architect-mcp = "specdd.mcp.architect:main"
specdd-implementer-mcp = "specdd.mcp.implementer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["specdd"]
branch = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
